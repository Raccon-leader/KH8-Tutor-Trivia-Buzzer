<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzer - KH8 Trivia</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #0f3827;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }
        input, button {
            padding: 15px;
            font-size: 1.2rem;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
        }
        #buzz-btn {
            flex: 1;
            background-color: #F19C2E;
            color: #0f3827;
            font-size: 3rem;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 0 #b57018;
            cursor: pointer;
        }
        #buzz-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #b57018;
        }
        /* Host Card Styles */
        .host-card {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid #F19C2E;
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            text-align: left;
        }
        .answer-box {
            background-color: #1b5e3f;
            border-left: 5px solid #F19C2E;
            padding: 15px;
            margin-top: 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <!-- Join Form -->
    <div id="join-form">
        <h2>Join KH8 Trivia Game</h2>
        <input type="text" id="room-code-input" placeholder="Enter Room Code" style="text-transform: uppercase;">
        <br>
        <input type="text" id="player-name-input" placeholder="Your Team Name">
        <br>
        <button id="join-btn">Connect Buzzer</button>
    </div>

    <!-- Regular Player Area -->
    <div id="buzzer-area" style="display: none; flex-direction: column; flex: 1;">
        <h3 id="connected-status">Connected as: <span id="team-label"></span></h3>
        <button id="buzz-btn">BUZZ!</button>
    </div>

    <!-- Secret Host Area -->
    <div id="host-area" style="display: none; text-align: center; flex: 1;">
        <h2 style="color: #F19C2E; margin-bottom: 5px;">👑 Host View</h2>
        <p style="margin-top: 0; opacity: 0.8;">Connected to room <span id="host-room-code"></span></p>
        
        <div id="host-waiting" style="margin-top: 40px; font-style: italic; color: #ccc;">
            Waiting for a question to be selected on the main board...
        </div>

        <div id="host-card" class="host-card" style="display: none;">
            <div id="host-category" style="color: #F19C2E; font-weight: bold; font-size: 1.2rem;"></div>
            <p id="host-question" style="font-size: 1.3rem; margin: 15px 0;"></p>
            <div class="answer-box">
                <small style="text-transform: uppercase; letter-spacing: 1px; color: #F19C2E;">Answer:</small>
                <div id="host-answer" style="font-size: 1.6rem; font-weight: bold; margin-top: 5px;"></div>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;

        // Auto-fill room code from QR URL parameter
        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codeParam = urlParams.get("code");
            if (codeParam) {
                document.getElementById("room-code-input").value = codeParam.toUpperCase();
            }
        });

        document.getElementById("join-btn").addEventListener("click", () => {
            const code = document.getElementById("room-code-input").value.trim().toUpperCase();
            const name = document.getElementById("player-name-input").value.trim();

            if (!code || !name) {
                alert("Please enter both Room Code and Team Name");
                return;
            }

            peer = new Peer();
            
            peer.on("open", () => {
                conn = peer.connect(`kh8-trivia-${code}`);
                
                conn.on("open", () => {
                    document.getElementById("join-form").style.display = "none";
                    
                    // CHECK FOR SECRET HOST NAME
                    if (name.toLowerCase() === "host 77") {
                        document.getElementById("host-area").style.display = "block";
                        document.getElementById("host-room-code").innerText = code;
                    } else {
                        document.getElementById("buzzer-area").style.display = "flex";
                        document.getElementById("team-label").innerText = name;
                    }
                });

                // Listen for messages from host computer
                conn.on("data", (data) => {
                    // Buzz feedback for players
                    if (data.type === "BUZZ_RESULT") {
                        if (data.winner === name && navigator.vibrate) {
                            navigator.vibrate([100, 50, 100]);
                        }
                    }

                    // Live Question & Answer updates for Host 77
                    if (data.type === "QUESTION_UPDATE" && name.toLowerCase() === "host 77") {
                        document.getElementById("host-waiting").style.display = "none";
                        document.getElementById("host-card").style.display = "block";
                        document.getElementById("host-category").innerText = `${data.category} (${data.value} pts)`;
                        document.getElementById("host-question").innerText = data.question;
                        document.getElementById("host-answer").innerText = data.answer;
                    }
                });
            });
        });

        document.getElementById("buzz-btn").addEventListener("click", () => {
            if (conn && conn.open) {
                const name = document.getElementById("player-name-input").value.trim();
                conn.send({ type: "BUZZ", teamName: name });
            }
        });
    </script>
</body>
</html>
